<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Responsive Image Gallery</title>
  <style>
    /* ==========================================
       1. CORE STYLES & VARIABLES
       ========================================== */
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --primary-color: #3498db;
      --primary-hover: #2980b9;
      --overlay-bg: rgba(0, 0, 0, 0.9);
      --transition-speed: 0.3s;
      --border-radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem 1rem;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }

    /* ==========================================
       2. FILTER BUTTONS
       ========================================== */
    .filter-wrapper {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .filter-btn {
      background-color: #fff;
      border: 2px solid #ddd;
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      transition: all var(--transition-speed) ease;
    }

    .filter-btn:hover, 
    .filter-btn.active {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
      color: white;
      transform: translateY(-2px);
    }

    /* ==========================================
       3. RESPONSIVE IMAGE GRID
       ========================================== */
    .gallery-grid {
      display: grid;
      /* Automatically adjusts column count based on available space */
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .gallery-item {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      cursor: pointer;
      position: relative;
      transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease, opacity var(--transition-speed) ease;
    }

    /* Smooth scale and shadow lift on hover */
    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }

    /* Hidden state for filtered items */
    .gallery-item.hidden {
      opacity: 0;
      transform: scale(0.8);
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      padding: 0;
      margin: 0;
    }

    .gallery-item img {
      width: 100%;
      height: 220px;
      object-fit: cover; /* Keeps aspect ratio intact while filling the space */
      display: block;
      transition: transform var(--transition-speed) ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    .item-info {
      padding: 1rem;
    }

    .item-info h3 {
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }

    .item-info p {
      font-size: 0.85rem;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ==========================================
       4. LIGHTBOX MODAL OVERLAY
       ========================================== */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--overlay-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-speed) ease;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-content {
      position: relative;
      max-width: 85%;
      max-height: 80%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      transform: scale(0.95);
      transition: transform var(--transition-speed) ease;
    }

    .lightbox.active .lightbox-img {
      transform: scale(1);
    }

    .lightbox-caption {
      color: #fff;
      margin-top: 1rem;
      font-size: 1.2rem;
      text-align: center;
    }

    /* Lightbox UI Navigation Controls */
    .close-btn {
      position: absolute;
      top: -40px;
      right: 0;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      background: none;
      border: none;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.1);
      color: white;
      border: none;
      padding: 1rem;
      font-size: 1.5rem;
      cursor: pointer;
      border-radius: 50%;
      transition: background var(--transition-speed);
      user-select: none;
    }

    .nav-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .prev-btn { left: -60px; }
    .next-btn { right: -60px; }

    /* Adjust nav buttons for tighter screens */
    @media (max-width: 768px) {
      .prev-btn { left: -20px; background: rgba(0,0,0,0.5); }
      .next-btn { right: -20px; background: rgba(0,0,0,0.5); }
      .close-btn { right: 10px; top: -50px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Visual Gallery Explorer</h1>

    <!-- Category Filters -->
    <div class="filter-wrapper">
      <button class="filter-btn active" data-filter="all">All Works</button>
      <button class="filter-btn" data-filter="nature">Nature</button>
      <button class="filter-btn" data-filter="architecture">Architecture</button>
      <button class="filter-btn" data-filter="animals">Animals</button>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="gallery">
      <!-- Item 1 -->
      <div class="gallery-item" data-category="nature">
        <img src="https://picsum.photos/id/10/800/600" alt="Serene mountain lake at blanketed morning mist">
        <div class="item-info">
          <h3>Mountain Mist</h3>
          <p>Nature</p>
        </div>
      </div>
      <!-- Item 2 -->
      <div class="gallery-item" data-category="architecture">
        <img src="https://picsum.photos/id/1011/800/600" alt="Symmetry of a modern concrete building facade">
        <div class="item-info">
          <h3>Urban Geometry</h3>
          <p>Architecture</p>
        </div>
      </div>
      <!-- Item 3 -->
      <div class="gallery-item" data-category="animals">
        <img src="https://picsum.photos/id/1025/800/600" alt="A curious pug wrapped snugly in a blue blanket">
        <div class="item-info">
          <h3>The Cozy Pug</h3>
          <p>Animals</p>
        </div>
      </div>
      <!-- Item 4 -->
      <div class="gallery-item" data-category="nature">
        <img src="https://picsum.photos/id/28/800/600" alt="A solitary forest path winding through towering pine trees">
        <div class="item-info">
          <h3>Deep Woods Trail</h3>
          <p>Nature</p>
        </div>
      </div>
      <!-- Item 5 -->
      <div class="gallery-item" data-category="architecture">
        <img src="https://picsum.photos/id/1031/800/600" alt="Old structural stone bridge spanning over a quiet canal">
        <div class="item-info">
          <h3>Classical Bridge</h3>
          <p>Architecture</p>
        </div>
      </div>
      <!-- Item 6 -->
      <div class="gallery-item" data-category="animals">
        <img src="https://picsum.photos/id/1062/800/600" alt="A majestic brown horse running freely through pasture fields">
        <div class="item-info">
          <h3>Wild Mustang</h3>
          <p>Animals</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox Structure -->
  <div class="lightbox" id="lightbox" role="dialog" aria-hidden="true">
    <div class="lightbox-content">
      <button class="close-btn" id="closeBtn" aria-label="Close Lightbox">&times;</button>
      <button class="nav-btn prev-btn" id="prevBtn" aria-label="Previous Image">&#10094;</button>
      <img src="" alt="" class="lightbox-img" id="lightboxImg">
      <div class="lightbox-caption" id="lightboxCaption"></div>
      <button class="nav-btn next-btn" id="nextBtn" aria-label="Next Image">&#10095;</button>
    </div>
  </div>

  <!-- ==========================================
       5. JAVASCRIPT ENGINE
       ========================================== */ -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const filterButtons = document.querySelectorAll('.filter-btn');
      const galleryItems = document.querySelectorAll('.gallery-item');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const lightboxCaption = document.getElementById('lightboxCaption');
      const closeBtn = document.getElementById('closeBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      
      let activeItems = [...galleryItems]; // Tracks items currently visible in selected filter
      let currentIndex = 0;

      /* -------------------------------------------
         A. CATEGORY FILTERING LOGIC
         ------------------------------------------- */
      filterButtons.forEach(button => {
        button.addEventListener('click', () => {
          // Switch active class styling on filter tabs
          document.querySelector('.filter-btn.active').classList.remove('active');
          button.classList.add('active');

          const filterValue = button.getAttribute('data-filter');
          
          galleryItems.forEach(item => {
            const itemCategory = item.getAttribute('data-category');
            if (filterValue === 'all' || itemCategory === filterValue) {
              item.classList.remove('hidden');
            } else {
              item.classList.add('hidden');
            }
          });

          // Re-index only the active, visible images so navigation doesn't skip
          activeItems = [...galleryItems].filter(item => !item.classList.contains('hidden'));
        });
      });

      /* -------------------------------------------
         B. LIGHTBOX CORE FUNCTIONALITY
         ------------------------------------------- */
      function openLightbox(index) {
        currentIndex = index;
        const targetItem = activeItems[currentIndex];
        const imgTarget = targetItem.querySelector('img');
        const titleTarget = targetItem.querySelector('h3');

        lightboxImg.src = imgTarget.src;
        lightboxImg.alt = imgTarget.alt;
        lightboxCaption.textContent = titleTarget.textContent;

        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden'; // Stop background scrolling
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = ''; // Re-enable background scrolling
      }

      function navigateLightbox(direction) {
        if (activeItems.length <= 1) return;
        
        if (direction === 'next') {
          currentIndex = (currentIndex + 1) % activeItems.length; // Loops back to start
        } else if (direction === 'prev') {
          currentIndex = (currentIndex - 1 + activeItems.length) % activeItems.length; // Loops to end
        }
        
        openLightbox(currentIndex);
      }

      // Bind click events on gallery cards to launch the Lightbox
      galleryItems.forEach(item => {
        item.addEventListener('click', () => {
          // Find out what position this element holds inside the filtered subset
          const indexInActive = activeItems.indexOf(item);
          if (indexInActive !== -1) {
            openLightbox(indexInActive);
          }
        });
      });

      // UI Controls Listeners
      closeBtn.addEventListener('click', closeLightbox);
      nextBtn.addEventListener('click', () => navigateLightbox('next'));
      prevBtn.addEventListener('click', () => navigateLightbox('prev'));

      // Close if user clicks out on the dark mask instead of UI elements
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      // Keyboard Ergonomics Support (Esc, Left/Right Arrows)
      document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;
        
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') navigateLightbox('next');
        if (e.key === 'ArrowLeft') navigateLightbox('prev');
      });
    });
  </script>
</body>
</html>
