<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Precision Calculator</title>
    <style>
    /* ==========================================
       1. GLOBAL RESET & STYLING VARS
       ========================================== */
    :root {
      --bg-gradient: linear-gradient(135deg, #e0eafc, #cfdef3);
      --calc-bg: #1e222b;
      --screen-bg: #0f1115;
      --text-main: #ffffff;
      --text-muted: #7f8c8d;
      --btn-number: #2c313c;
      --btn-number-hover: #3a414f;
      --btn-action: #3e4451;
      --btn-action-hover: #4e5565;
      --btn-accent: #e67e22;
      --btn-accent-hover: #f39c12;
      --transition-speed: 0.15s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, Helvetica, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
    }

    /* ==========================================
       2. CALCULATOR FRAME & STRUCTURE
       ========================================== */
    .calculator-frame {
      width: 100%;
      max-width: 360px;
      background-color: var(--calc-bg);
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3),
                  0 10px 10px rgba(0, 0, 0, 0.2);
    }

    /* Display Monitor Screen */
    .screen {
      background-color: var(--screen-bg);
      border-radius: 16px;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      text-align: right;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      word-wrap: break-word;
      word-break: break-all;
    }

    .expression-history {
      color: var(--text-muted);
      font-size: 1.1rem;
      min-height: 1.5rem;
      margin-bottom: 0.25rem;
      letter-spacing: 0.5px;
    }

    .primary-display {
      color: var(--text-main);
      font-size: 2.5rem;
      font-weight: 300;
      line-height: 1.2;
    }

    /* Grid Layout for Keys */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.8rem;
    }

    /* ==========================================
       3. INTERACTIVE KEYPAD COMPONENT BUTTONS
       ========================================== */
    button {
      outline: none;
      border: none;
      height: 65px;
      border-radius: 16px;
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      transition: background-color var(--transition-speed) ease, 
                  transform var(--transition-speed) ease;
    }

    button:active {
      transform: scale(0.95);
    }

    /* Specific Button Color Groupings */
    .btn-num {
      background-color: var(--btn-number);
    }
    .btn-num:hover {
      background-color: var(--btn-number-hover);
    }

    .btn-op {
      background-color: var(--btn-action);
      color: #54b3ff;
      font-weight: 600;
    }
    .btn-op:hover {
      background-color: var(--btn-action-hover);
    }

    .btn-sys {
      background-color: var(--btn-action);
      color: #e74c3c;
    }
    .btn-sys:hover {
      background-color: var(--btn-action-hover);
    }

    .btn-equal {
      background-color: var(--btn-accent);
      grid-column: span 2; /* Spans across columns for easy execution */
    }
    .btn-equal:hover {
      background-color: var(--btn-accent-hover);
    }
  </style>
</head>
<body>

  <div class="calculator-frame">
    <!-- Monitor Display Screen -->
    <div class="screen">
      <div class="expression-history" id="historyView"></div>
      <div class="primary-display" id="displayView">0</div>
    </div>

    <!-- Keypad Map Structure -->
    <div class="keypad-grid">
      <!-- Row 1 -->
      <button class="btn-sys" data-action="clear">AC</button>
      <button class="btn-sys" data-action="delete">⌫</button>
      <button class="btn-op" data-val="%">%</button>
      <button class="btn-op" data-val="/">÷</button>

      <!-- Row 2 -->
      <button class="btn-num" data-val="7">7</button>
      <button class="btn-num" data-val="8">8</button>
      <button class="btn-num" data-val="9">9</button>
      <button class="btn-op" data-val="*">×</button>

      <!-- Row 3 -->
      <button class="btn-num" data-val="4">4</button>
      <button class="btn-num" data-val="5">5</button>
      <button class="btn-num" data-val="6">6</button>
      <button class="btn-op" data-val="-">−</button>

      <!-- Row 4 -->
      <button class="btn-num" data-val="1">1</button>
      <button class="btn-num" data-val="2">2</button>
      <button class="btn-num" data-val="3">3</button>
      <button class="btn-op" data-val="+">+</button>

      <!-- Row 5 -->
      <button class="btn-num" data-val="0">0</button>
      <button class="btn-num" data-val=".">.</button>
      <button class="btn-equal" data-action="calculate">=</button>
    </div>
  </div>

  <!-- ==========================================
       4. JAVASCRIPT STATE ENGINE
       ========================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const displayView = document.getElementById('displayView');
      const historyView = document.getElementById('historyView');
      const keypad = document.querySelector('.keypad-grid');

      // Internal application state object
      let state = {
        currentInput: '0',  // Tracks string currently typed by user
        prevInput: '',      // Stores first operand when operation begins
        operator: null,     // Tracks chosen math assignment symbol
        isResetOnNext: false // Flag to wipe screen on input following execution
      };

      /* -------------------------------------------
         A. COMPUTATIONAL MATH ACTIONS
         ------------------------------------------- */
      function computeResult() {
        const prev = parseFloat(state.prevInput);
        const current = parseFloat(state.currentInput);

        if (isNaN(prev) || isNaN(current)) return;

        let outputValue = 0;
        switch (state.operator) {
          case '+': outputValue = prev + current; break;
          case '-': outputValue = prev - current; break;
          case '*': outputValue = prev * current; break;
          case '/': 
            if (current === 0) {
              triggerError("Division by Zero Error");
              return;
            }
            outputValue = prev / current; 
            break;
          case '%': outputValue = prev % current; break;
          default: return;
        }

        // Clean trailing precision floats (e.g., 0.1 + 0.2 = 0.30000000004)
        outputValue = Math.round(outputValue * 1e12) / 1e12;

        state.currentInput = outputValue.toString();
        state.operator = null;
        state.prevInput = '';
        state.isResetOnNext = true;
      }

      function triggerError(msg) {
        state.currentInput = 'Error';
        state.prevInput = '';
        state.operator = null;
        state.isResetOnNext = true;
        updateUI(msg);
      }

      /* -------------------------------------------
         B. STATE MANAGER LOGIC
         ------------------------------------------- */
      function handleDigitInput(digit) {
        if (state.currentInput === 'Error') handleClear();

        if (state.isResetOnNext) {
          state.currentInput = digit === '.' ? '0.' : digit;
          state.isResetOnNext = false;
          return;
        }

        // Enforce safe inputs
        if (state.currentInput === '0' && digit !== '.') {
          state.currentInput = digit; // Replace default leading zero
          return;
        }
        if (digit === '.' && state.currentInput.includes('.')) return; // No multiple dots

        state.currentInput += digit;
      }

      function handleOperatorInput(nextOp) {
        if (state.currentInput === 'Error') return;

        // Allows changing operator mid-calculation if user mistyped
        if (state.operator && state.isResetOnNext) {
          state.operator = nextOp;
          return;
        }

        if (state.operator) {
          computeResult(); // Chain expressions sequentially
        }

        state.prevInput = state.currentInput;
        state.operator = nextOp;
        state.isResetOnNext = true;
      }

      function handleClear() {
        state.currentInput = '0';
        state.prevInput = '';
        state.operator = null;
        state.isResetOnNext = false;
      }

      function handleDelete() {
        if (state.isResetOnNext || state.currentInput === 'Error') {
          handleClear();
          return;
        }
        if (state.currentInput.length <= 1) {
          state.currentInput = '0';
        } else {
          state.currentInput = state.currentInput.slice(0, -1);
        }
      }

      /* -------------------------------------------
         C. RENDERING SYNC ENGINE
         ------------------------------------------- */
      function updateUI(customHistoryText = null) {
        displayView.textContent = state.currentInput;
        
        if (customHistoryText) {
          historyView.textContent = customHistoryText;
          return;
        }

        // Clean UI visual conversion for user view
        if (state.operator) {
          let symbolMap = { '+': '+', '-': '−', '*': '×', '/': '÷', '%': '%' };
          historyView.textContent = `${state.prevInput} ${symbolMap[state.operator]}`;
        } else {
          historyView.textContent = '';
        }
      }

      /* -------------------------------------------
         D. INTERACTIVE EVENT HANDLERS
         ------------------------------------------- */
      // Mouse Click Event Route Dispatching
      keypad.addEventListener('click', (e) => {
        const button = e.target.closest('button');
        if (!button) return;

        const val = button.getAttribute('data-val');
        const action = button.getAttribute('data-action');

        if (val) {
          if (!isNaN(val) || val === '.') {
            handleDigitInput(val);
          } else {
            handleOperatorInput(val);
          }
        } else if (action) {
          if (action === 'clear') handleClear();
          if (action === 'delete') handleDelete();
          if (action === 'calculate') computeResult();
        }
        updateUI();
      });

      // Keyboard Physical Hook Integrations
      document.addEventListener('keydown', (e) => {
        let key = e.key;
        
        // Normalize specific native command triggers
        if (key === 'Escape') { handleClear(); e.preventDefault(); }
        else if (key === 'Backspace') { handleDelete(); e.preventDefault(); }
        else if (key === 'Enter' || key === '=') { computeResult(); e.preventDefault(); }
        else if (key === 'c' || key === 'C') { handleClear(); }
        else if (!isNaN(key) || key === '.') { handleDigitInput(key); }
        else if (['+', '-', '*', '/', '%'].includes(key)) { handleOperatorInput(key); e.preventDefault(); }
        
        updateUI();
      });
    });
  </script>
</body>
</html>
