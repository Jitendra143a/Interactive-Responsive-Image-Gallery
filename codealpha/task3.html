<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Player</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#141e30,#243b55);
    }

    .player{
      width:350px;
      background:white;
      border-radius:20px;
      padding:25px;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
      text-align:center;
    }

    .cover{
      width:220px;
      height:220px;
      margin:auto;
      border-radius:15px;
      overflow:hidden;
      margin-bottom:20px;
    }

    .cover img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    h2{
      font-size:24px;
      color:#222;
      margin-bottom:5px;
    }

    h4{
      color:#777;
      margin-bottom:20px;
    }

    audio{
      display:none;
    }

    .progress-container{
      width:100%;
      height:6px;
      background:#ddd;
      border-radius:10px;
      cursor:pointer;
      margin:15px 0;
    }

    .progress{
      height:100%;
      width:0%;
      background:#1db954;
      border-radius:10px;
    }

    .time{
      display:flex;
      justify-content:space-between;
      font-size:14px;
      color:#555;
      margin-bottom:15px;
    }

    .controls{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      margin:20px 0;
    }

    .controls button{
      border:none;
      background:#1db954;
      color:white;
      width:55px;
      height:55px;
      border-radius:50%;
      font-size:20px;
      cursor:pointer;
      transition:0.3s;
    }

    .controls button:hover{
      transform:scale(1.1);
      background:#14833b;
    }

    .volume{
      margin-top:15px;
    }

    .volume input{
      width:100%;
    }

    .playlist{
      margin-top:20px;
      text-align:left;
    }

    .playlist h3{
      margin-bottom:10px;
      color:#333;
    }

    .song{
      padding:10px;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
    }

    .song:hover{
      background:#f0f0f0;
    }

    .active{
      background:#1db954;
      color:white;
    }
  </style>
</head>

<body>

  <div class="player">

    <div class="cover">
      <img id="cover" src="https://picsum.photos/300" alt="cover">
    </div>

    <h2 id="title">Song Name</h2>
    <h4 id="artist">Artist Name</h4>

    <audio id="audio"></audio>

    <div class="progress-container" id="progressContainer">
      <div class="progress" id="progress"></div>
    </div>

    <div class="time">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button id="prev">⏮</button>
      <button id="play">▶</button>
      <button id="next">⏭</button>
    </div>

    <div class="volume">
      <label>🔊 Volume</label>
      <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
    </div>

    <div class="playlist">
      <h3>Playlist</h3>
      <div id="playlist"></div>
    </div>

  </div>

  <script>
    const songs = [
      {
        title: "Dreams",
        artist: "Artist One",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        cover: "https://picsum.photos/id/237/300/300"
      },
      {
        title: "Night Sky",
        artist: "Artist Two",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
        cover: "https://picsum.photos/id/238/300/300"
      },
      {
        title: "Chill Beat",
        artist: "Artist Three",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
        cover: "https://picsum.photos/id/239/300/300"
      }
    ];

    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("play");
    const nextBtn = document.getElementById("next");
    const prevBtn = document.getElementById("prev");

    const title = document.getElementById("title");
    const artist = document.getElementById("artist");
    const cover = document.getElementById("cover");

    const progress = document.getElementById("progress");
    const progressContainer = document.getElementById("progressContainer");

    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");

    const volume = document.getElementById("volume");
    const playlist = document.getElementById("playlist");

    let songIndex = 0;
    let isPlaying = false;

    // Load Song
    function loadSong(song){
      title.textContent = song.title;
      artist.textContent = song.artist;
      audio.src = song.src;
      cover.src = song.cover;

      updatePlaylistUI();
    }

    loadSong(songs[songIndex]);

    // Play Song
    function playSong(){
      audio.play();
      isPlaying = true;
      playBtn.textContent = "⏸";
    }

    // Pause Song
    function pauseSong(){
      audio.pause();
      isPlaying = false;
      playBtn.textContent = "▶";
    }

    // Play Pause Toggle
    playBtn.addEventListener("click", () => {
      if(isPlaying){
        pauseSong();
      } else {
        playSong();
      }
    });

    // Next Song
    nextBtn.addEventListener("click", () => {
      songIndex++;
      if(songIndex > songs.length - 1){
        songIndex = 0;
      }
      loadSong(songs[songIndex]);
      playSong();
    });

    // Previous Song
    prevBtn.addEventListener("click", () => {
      songIndex--;
      if(songIndex < 0){
        songIndex = songs.length - 1;
      }
      loadSong(songs[songIndex]);
      playSong();
    });

    // Progress Update
    audio.addEventListener("timeupdate", (e) => {
      const { duration, currentTime } = e.srcElement;

      const progressPercent = (currentTime / duration) * 100;
      progress.style.width = `${progressPercent}%`;

      // Time Update
      let currentMin = Math.floor(currentTime / 60);
      let currentSec = Math.floor(currentTime % 60);

      if(currentSec < 10){
        currentSec = "0" + currentSec;
      }

      currentTimeEl.textContent = `${currentMin}:${currentSec}`;

      let durationMin = Math.floor(duration / 60);
      let durationSec = Math.floor(duration % 60);

      if(durationSec < 10){
        durationSec = "0" + durationSec;
      }

      if(durationSec){
        durationEl.textContent = `${durationMin}:${durationSec}`;
      }
    });

    // Set Progress
    progressContainer.addEventListener("click", (e) => {
      const width = progressContainer.clientWidth;
      const clickX = e.offsetX;
      const duration = audio.duration;

      audio.currentTime = (clickX / width) * duration;
    });

    // Volume Control
    volume.addEventListener("input", () => {
      audio.volume = volume.value;
    });

    // Autoplay Next Song
    audio.addEventListener("ended", () => {
      songIndex++;

      if(songIndex > songs.length - 1){
        songIndex = 0;
      }

      loadSong(songs[songIndex]);
      playSong();
    });

    // Playlist
    function renderPlaylist(){
      playlist.innerHTML = "";

      songs.forEach((song, index) => {
        const div = document.createElement("div");

        div.classList.add("song");

        if(index === songIndex){
          div.classList.add("active");
        }

        div.innerHTML = `
          🎵 ${song.title} - ${song.artist}
        `;

        div.addEventListener("click", () => {
          songIndex = index;
          loadSong(songs[songIndex]);
          playSong();
        });

        playlist.appendChild(div);
      });
    }

    function updatePlaylistUI(){
      renderPlaylist();
    }

    renderPlaylist();
  </script>

</body>
</html>
